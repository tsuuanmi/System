name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # pinned like node-version; 26.04 changes how a timed-out check's kill is reported (exit 137), see PLAN section 4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck, unit and offline smoke tests
        run: pnpm check
