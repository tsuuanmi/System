name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # pinned like node-version; 26.04 changes how a timed-out check's kill is reported (exit 137), see PLAN section 4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Make bubblewrap usable (ADR-0016 layer tests)
        run: |
          command -v bwrap >/dev/null || sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build, typecheck, unit and offline smoke tests
        run: pnpm check
        env:
          SYSTEM_REQUIRE_SANDBOX: '1'
