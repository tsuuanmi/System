name: Documentation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    # pinned like node-version; 26.04 changes how a timed-out check's kill is reported (exit 137), see PLAN section 4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate documentation
        run: python3 tools/docs.py check
      - name: Verify generated indexes
        run: python3 tools/docs.py sync --check
      - name: Smoke test portable bootstrap
        run: bash tools/smoke_bootstrap.sh
      - name: Check covered-path impact
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/docs.py impact "origin/${{ github.base_ref }}"
