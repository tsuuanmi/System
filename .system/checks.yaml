# Required checks System runs on a change to this repository
# (code.required-checks, pinned from the base commit at admission).
#
# The verifier runs every check in order in ONE worktree with ONE throwaway
# HOME, so the checks share what earlier ones produced: `install` and `build`
# run once and the later checks reuse node_modules and dist. One check per
# part, so a failure names the part that failed. No shared package store: the
# install takes under 10 s from an empty HOME, so leaking host state into the
# check would buy nothing.
#
# `paths` (PROP-0007 decision 5): every check but `docs` runs only when the
# change touches code, its tests, its tooling or the Charter, or a check of the
# same verify step failed earlier in the Work; a change to docs alone runs
# `docs`. How the verifier selects checks: packages/verifiers/README.md.
# One list for all of them, so `install` and `build` run whenever a later
# check needs them.
checks:
  - name: docs
    run: python3 tools/docs.py check && python3 tools/docs.py sync --check
    timeoutSeconds: 120
  - name: statusmd
    # Item cm-4: STATUS.md has no problem (bad line, duplicate ID, unknown `after:` ID, cycle). No install needed: it
    # imports only the parser file, so a change to STATUS.md alone runs it.
    run: node tools/check-status.ts STATUS.md
    timeoutSeconds: 60
    paths: [STATUS.md, tools/check-status.ts, packages/work/src/status-parse.ts, .system/checks.yaml]
  - name: install
    run: corepack pnpm install --frozen-lockfile
    timeoutSeconds: 300
    paths: &code [packages/**, tests/**, test-support/**, bin/**, workflows/**, patches/**, .system/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.json, eslint.config.js, docs/requirements/purpose.md]
  - name: build
    run: corepack pnpm build
    timeoutSeconds: 300
    paths: *code
  - name: typecheck
    run: corepack pnpm typecheck
    timeoutSeconds: 300
    paths: *code
  - name: lint
    # Item fl-10 (Escaped defect 4): only `@typescript-eslint/no-floating-promises` and `@typescript-eslint/return-await` ('in-try-catch'), over the sources and tests.
    run: corepack pnpm lint
    timeoutSeconds: 300
    paths: *code
  - name: unit
    run: corepack pnpm test
    timeoutSeconds: 300
    paths: *code
  - name: smoke
    # The booted-profile smoke tests (bin/system against throwaway DSH homes,
    # test files in parallel); they caught what the unit tests missed when the
    # lock format changed.
    run: corepack pnpm smoke
    timeoutSeconds: 600
    paths: *code
  - name: upgrade
    # Item rb-1: rehearse the release. An install of the last release (`origin/main`) in temporary homes runs ITS `system update` to this
    # commit and must keep it, with its afterInstall Verdict passed (Escaped defects 3, 7, 8 and fl-6 showed only on such an update).
    # Offline; tools/upgrade-rehearsal.mjs says what it replaces (each check's `run`, so the update does not run the suite and itself).
    # tests/upgrade-rehearsal.test.ts runs it twice: this commit, and the shape of Escaped defect 7 (a key main refuses), which must fail.
    run: node --test --test-timeout=850000 tests/upgrade-rehearsal.test.ts
    timeoutSeconds: 900
    paths: [bin/**, packages/host/**, packages/app/**, packages/verifiers/**, packages/work/**, .system/checks.yaml, workflows/**]
  - name: web
    # The Website Worker's tests, which drive a real headed Chrome on Xvfb
    # (milestone WW). Kept out of unit and smoke so the main path stays fast and
    # System is tested without the web Runtime. They run only when the Website
    # Worker itself is being developed: its Runtime, its driver, its test or the
    # headed-Chrome helper. A change to shared test support, to this file or to
    # the dependencies does not run them for every Work; the release check of
    # `system update` is a change from the running release, so it runs `web`
    # only when one of these paths differs between the two.
    run: corepack pnpm test:web
    timeoutSeconds: 600
    paths: [packages/web-worker/**, packages/web-driver/**, tests/chatgpt-web.test.ts, test-support/headed.ts]

# Item fl-6: what `system update` runs on the installed release (Item fl-5, `release.install-check`), one check per
# user-visible surface that broke only on the install (2026-11-14/15). Each is read-only. The command runs in a
# worktree of the release commit, with the install's `system` first on PATH, so `$PWD` is the release's repository
# (a git checkout: only the install-time run has that path, never hard-code one) and `system` is the installed code.
afterInstall:
  - name: doctor
    # Fact only the install has: the Host the install talks to is running the new release.
    run: |
      out=$(system doctor) || { printf '%s\n' "$out"; exit 1; }
      printf '%s\n' "$out"
      printf '%s\n' "$out" | grep -Eq '^ +host +answering:'
    timeoutSeconds: 60
  - name: workers
    # At least one Worker (an account line at column 0, after the `registered:` line), and each is followed by an `abilities:` line.
    run: |
      out=$(system workers) || exit 1
      printf '%s\n' "$out"
      printf '%s\n' "$out" | awk '/^registered:/ { next } /^[^ ]/ { n++; if (n > 1 && !a) bad = 1; a = 0; next } /^  abilities:/ { a = 1 } END { if (n < 1 || bad || !a) exit 1 }'
    timeoutSeconds: 60
  - name: status
    # The install's repository fetches only main, so refresh dev first. A note about the ref read (`note: read <ref> ...`, its age) is fine; any other `note:` line reports a problem.
    run: |
      git fetch -q origin dev:refs/remotes/origin/dev || { echo 'cannot fetch origin dev into the install repository' >&2; exit 1; }
      out=$(system status --repo "$PWD") || exit 1
      printf '%s\n' "$out"
      ! printf '%s\n' "$out" | grep '^note:' | grep -v '^note: read '
    timeoutSeconds: 60
  - name: bootstrap
    # The install's repository fetches only main, so refresh dev first.
    run: |
      git fetch -q origin dev:refs/remotes/origin/dev || { echo 'cannot fetch origin dev into the install repository' >&2; exit 1; }
      system bootstrap check --repo "$PWD"
    timeoutSeconds: 120
  - name: mcp
    # Starts the installed `system mcp` over stdio; tools/mcp-probe.mjs times out by itself.
    run: node tools/mcp-probe.mjs --timeout 30 -- system mcp
    timeoutSeconds: 60
