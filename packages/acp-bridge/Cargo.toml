[package]
name = "system-acp-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Optional System WorkerPort bridge to stable ACP v1 agents"

[dependencies]
# Official SDK; exact pin to avoid silent ACP protocol changes.
agent-client-protocol = { version = "=5.0.0", features = ["process"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
