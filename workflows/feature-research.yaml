# Feature with research (operator, 2026-11-09): feature.yaml, with a research
# step first whose report and sources the plan reads, for a change that needs
# outside knowledge (an API, a standard, a library). Otherwise the same:
# a change made in stages, each by the Worker
# that suits it, handing over only Artifacts. plan writes what to change, where,
# and which tests prove it; tests writes those tests from the plan alone, before
# any code, on its own Account (the role code.tests); the red check proves they
# fail where they should and nothing else breaks; implement makes them pass
# without changing them (the controller puts the files the tests step wrote back when it records the change, dg-10; tests-frozen is the backstop); docs brings the docs in line
# (the role code.docs); the plan, implement and docs steps carry the role code.develop; the repository's checks verify the result and System
# merges it into its base (df-26).
# Stages run one after the other, each on the previous change. The code is
# checked before the docs, so a failure goes back to the step that can fix it,
# with the failure as input (retry); a failing code check reopens tests when
# implement is out of budget; the second check, after docs, runs what
# the docs change touches. The default Workflow for a code change (df-27);
# software-engineering.yaml remains for a change too small for a plan.
schema: system.workflow/v1
id: feature-research
version: 3
steps:
  - id: research
    capabilities: [research, web-search, tier.standard]
    inputs:
      task: $work.input
    outputs: [report, sources]
    instructions: |
      The checkout is for reading only. Find what the Task needs
      from outside this repository: the APIs, standards or libraries it
      touches, their current versions and behaviour, and known pitfalls.
      Write "report" as Markdown, each claim with its source, and "sources"
      as one URL per line with what each one supports. Say what you could
      not confirm.
  - id: plan
    dependsOn: [research]
    capabilities: [code-write, code.develop]
    inputs:
      task: $work.input
      report: $steps.research.report
      sources: $steps.research.sources
    outputs: [checkout, plan]
    instructions: |
      Read-only: change no file in the checkout. Read the Task and the code it
      concerns, and write "plan" as Markdown for Workers who will not read the
      code the way you did:
      1. Goal: what changes for a user, in two or three sentences.
      2. Changes: each file to change or add, what to do there, and why.
      3. Tests: each test to write first, with its file, what it calls and what
         it asserts, so that it fails now and passes once the change is made;
         then each existing test that asserts the behaviour you change, which
         the implement step must update (grep the tests for it).
      4. Docs: each doc or README whose text the change makes stale.
      5. Risks and what is out of scope.
      Name exact files, functions and commands; quote the code you refer to.
  - id: tests
    dependsOn: [plan]
    capabilities: [code-write, code.tests, tier.standard]
    inputs:
      task: $work.input
      plan: $steps.plan.plan
    retry: { onFail: [red, checks-code.checks, implement], max: 1 }
    outputs: [change]
    instructions: |
      Write the tests listed under "Tests" in the plan, and only those: no
      code under test. Run them and make sure each one fails now, for the
      reason the plan gives, not because of a typo or a missing import. Leave
      them failing. The red check then runs the repository's checks on your
      change: each check marked `red: pass` in .system/checks.yaml (such as
      build, typecheck or lint) must still pass, so your tests compile and the
      docs check is clean; at least one other check must fail. On a second
      attempt, the red check's failure is in your input: fix what it names.
      Your new tests must fail only by assertion, or by a missing symbol
      (import, export, function) of the code under change, never by an error
      of their own (a missing import in a test file, a syntax error, a type
      error). Run the repository's typecheck or compile of your test files and
      fix such errors before finishing. A later attempt may also come from a
      failing check of implement's change: the failure in your input names
      what to fix in the tests.
  # The red check: the tests step's change, before any code, judged by the
  # repository's own checks rather than by the Worker's report of its run.
  - id: red
    dependsOn: [tests]
    verify:
      capability: code.required-checks
      subject: $steps.tests.change
      criteria: red-v1
      # An inconclusive verdict (every failing check fails on the base too) holds the Work here, before implement (dg-2).
      holdInconclusive: true
  - id: implement
    dependsOn: [red]
    capabilities: [code-write, code.develop]
    retry: { onFail: [tests-frozen, checks-code.checks], max: 1 }
    freeze: $steps.tests.change
    inputs:
      task: $work.input
      plan: $steps.plan.plan
      tests: $steps.tests.change
    outputs: [change]
    instructions: |
      The files the tests step wrote are frozen. A change to any of them
      (edit, rename, delete) is undone automatically when your change is
      recorded. Do not edit them even to fix a typo or a broken import. If a frozen test is wrong (it
      contradicts an existing rule, or cannot pass as written), change nothing
      and end your final message with a line "OBJECTION: <test file and name>:
      <why it is wrong>"; that reopens the tests step with your reason.
      The checkout holds the tests from the plan, which fail now (the red
      check ran them). Make the changes in the plan so that they pass. You may add new test files, and update tests that already
      existed and assert the behaviour the plan changes. Run the repository's
      checks that your change touches. On a second attempt, the failed check
      is in your input: fix what it names.
  # Tests frozen: implement's change against the tests step's commit.
  - id: tests-frozen
    dependsOn: [implement]
    verify:
      capability: code.required-checks
      subject: $steps.implement.change
      criteria: tests-frozen-v1
      inputs:
        tests: $steps.tests.change
  - id: checks-code
    dependsOn: [tests-frozen]
    uses: code-checks.yaml
    inputs:
      input: $steps.implement.change
  - id: docs
    dependsOn: [checks-code]
    capabilities: [code-write, code.develop, code.docs, tier.economy]
    retry: { onFail: [checks.checks], max: 1 }
    inputs:
      task: $work.input
      plan: $steps.plan.plan
      change: $steps.implement.change
    outputs: [change]
    instructions: |
      The checkout holds the change (`git diff HEAD~2` shows the tests and the
      code). Update the docs under "Docs" in the plan, and any other doc the
      change makes untrue, and nothing else: no code, no tests. One home per
      fact: link rather than repeat. If the repository has a docs check in
      .system/checks.yaml, run it.
  - id: checks
    dependsOn: [docs]
    uses: code-checks.yaml
    inputs:
      input: $steps.docs.change
  - id: publish
    dependsOn: [checks]
    effect:
      capability: git.publish
      subject: $steps.docs.change
      requires: [checks.checks]
      params: { merge: true }
  - id: accept
    dependsOn: [publish]
    accept:
      requires: [checks.checks]
