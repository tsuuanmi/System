# Software Engineering with a docs reading (operator, 2026-11-09): the same as
# software-engineering.yaml, plus an economy step that reads the change, while
# the checks run, and lists the docs it makes stale. That list is advice for the
# operator or the next Work, never a verdict: nothing waits on it. It becomes the
# default only if it often finds stale docs.
schema: system.workflow/v1
id: software-engineering-docs
version: 2
steps:
  - id: implement
    capabilities: [code-write]
    inputs:
      task: $work.input
    outputs: [change]
    retry: { onFail: [checks.checks], max: 1 }
  - id: checks
    dependsOn: [implement]
    uses: code-checks.yaml
    inputs:
      input: $steps.implement.change
  - id: docs-impact
    dependsOn: [implement]
    capabilities: [code-write, tier.economy]
    inputs:
      task: $work.input
      change: $steps.implement.change
    outputs: [checkout, docs]
    instructions: |
      Read-only: change no file in the checkout, which holds the change.
      Read the change (`git diff HEAD^`) and list the documentation it makes stale: each
      doc, the exact lines, and what they should say now. Write "docs" as
      Markdown; say "none" if the change leaves every doc true.
  - id: publish
    dependsOn: [checks]
    effect:
      capability: git.publish
      subject: $steps.implement.change
      requires: [checks.checks]
      params: { merge: true }
  - id: accept
    dependsOn: [publish]
    accept:
      requires: [checks.checks]
