# Software Engineering (MVP-0). A coding Worker changes the repository, the
# required checks verify the exact result, and Work is accepted on that verdict.
# Pushing and the draft PR are System effects (M5), not Workflow steps.
schema: system.workflow/v1
id: software-engineering
version: 1
steps:
  - id: implement
    capabilities: [code-write]
    inputs:
      task: $work.input
    outputs: [change]
  - id: checks
    dependsOn: [implement]
    verify:
      capability: code.required-checks
      subject: $steps.implement.change
      criteria: repo-checks-v1
  - id: accept
    dependsOn: [checks]
    accept:
      requires: [checks]
