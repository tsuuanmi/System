# Software Engineering (MVP-0). A coding Worker changes the repository, the
# required checks (the Sub-workflow code-checks.yaml) verify the exact result, System pushes that exact commit to
# system/<work> and opens a draft pull request (never merges), and Work is
# accepted on the verdict.
schema: system.workflow/v1
id: software-engineering
version: 2
steps:
  - id: implement
    capabilities: [code-write, code.develop]
    inputs:
      task: $work.input
    outputs: [change]
    # One automatic further attempt on the same change when the checks fail, and one on the base's new tip when the publish is refused for a conflict or a failing check on the merge (sc-7).
    retry: { onFail: [checks.checks, publish], max: 1 }
    instructions: |
      If your input has a base, your working directory is the base branch's
      current tip, because the publish of your previous change was refused (a
      conflict or failing checks on the merge): re-apply your previous change on it (git
      cherry-pick or git diff, then apply), resolve the conflicts, read the
      failure for what failed, and never give up the intent of the change.

  - id: checks
    dependsOn: [implement]
    uses: code-checks.yaml
    inputs:
      input: $steps.implement.change
  - id: publish
    dependsOn: [checks]
    effect:
      capability: git.publish
      subject: $steps.implement.change
      requires: [checks.checks]
      params: { merge: true }
  - id: accept
    dependsOn: [publish]
    accept:
      requires: [checks.checks]
