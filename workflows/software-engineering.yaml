# Software Engineering (MVP-0). A coding Worker changes the repository, the
# required checks (the Sub-workflow code-checks.yaml) verify the exact result, System pushes that exact commit to
# system/<work> and opens a draft pull request (never merges), and Work is
# accepted on the verdict.
schema: system.workflow/v1
id: software-engineering
version: 1
steps:
  - id: implement
    capabilities: [code-write]
    inputs:
      task: $work.input
    outputs: [change]
    # One automatic further attempt on the same change when the checks fail (PLAN DF2b).
    retry: { onFail: [checks.checks], max: 1 }
  - id: checks
    dependsOn: [implement]
    uses: code-checks.yaml
    inputs:
      input: $steps.implement.change
  - id: publish
    dependsOn: [checks]
    effect:
      capability: git.publish
      subject: $steps.implement.change
      requires: [checks.checks]
      params: { merge: true }
  - id: accept
    dependsOn: [publish]
    accept:
      requires: [checks.checks]
